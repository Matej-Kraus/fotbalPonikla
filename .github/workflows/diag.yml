name: FTP diagnostika
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: curl authenticated FTP test (IPv4 forced)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "test" > test.txt
          echo "--- curl -4 login+upload ---"
          timeout 15 curl -4 -v --connect-timeout 8 -T test.txt "ftp://$FTP_HOST/test.txt" --user "$FTP_USER:$FTP_PASS" 2>&1 | grep -v "^< 150\|^> PASS" | tail -40 || true
      - name: python ftplib IPv4-forced test
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 -c "
          import ftplib, socket, os
          host = os.environ['FTP_HOST']
          addr = socket.getaddrinfo(host, 21, socket.AF_INET)[0][4][0]
          print('Connecting via IPv4 addr:', addr)
          ftp = ftplib.FTP()
          ftp.connect(addr, 21, timeout=10)
          print(ftp.getwelcome())
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          print('Login OK')
          print(ftp.nlst())
          ftp.quit()
          "
