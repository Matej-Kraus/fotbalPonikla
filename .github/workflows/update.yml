name: Aktualizace tabulky a zápasů

on:
  schedule:
    # Čtyřikrát denně, ne jednou týdně. GitHub naplánované běhy odkládá
    # i o hodiny (u tohoto repozitáře to narostlo z 30 minut na 6 hodin)
    # a občas je zahodí úplně — při jediném pokusu za týden pak web stojí
    # celé dny. Skript je idempotentní a commituje jen při změně, takže
    # běhy navíc nic nestojí ani nešpiní historii.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Dva běhy najednou by si přepisovaly commity.
concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Nastavení gitu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Na hosting se odtud nenahrává — Websupport spojení z GitHubu zavírá.
      # Web si tabulky bere přesměrováním z GitHub Pages, takže stačí commit.
      - name: Spuštění update.py
        # Tři pokusy — sportmap.cz i denik.cz občas krátce nereagují.
        # Skript je idempotentní, opakování nic nerozbije.
        run: |
          for pokus in 1 2 3; do
            echo "::group::Pokus $pokus"
            if python update.py; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Pokus $pokus selhal."
            [ "$pokus" -lt 3 ] && sleep 60
          done
          echo "::error::Aktualizace selhala i po třech pokusech."
          exit 1

      # Zelený běh má znamenat "na webu je aktuální tabulka", ne jen
      # "commit prošel". Kontroluje se Pages (zdroj) i ostrý web (výsledek).
      - name: Kontrola, že se nová verze dostala na web
        run: |
          PAGES="https://matej-kraus.github.io/fotbalPonikla"
          declare -A VEREJNE=(
            [tabulka.html]="https://tjponikla.cz/tabulka.html"
            [nadchazejici_zapasy.html]="https://tjponikla.cz/nadhazenici.html"
          )

          for soubor in tabulka.html nadchazejici_zapasy.html; do
            echo "::group::$soubor na GitHub Pages"
            ok=0
            for pokus in $(seq 1 16); do
              curl -sS -m 20 -o "/tmp/p-$soubor" "$PAGES/$soubor?cb=$(date +%s)" || true
              if cmp -s "/tmp/p-$soubor" "$soubor"; then
                echo "shoda po $((pokus * 30))s"
                ok=1
                break
              fi
              sleep 30
            done
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              echo "::error::$soubor se na GitHub Pages nepropsal ani po 8 minutách."
              exit 1
            fi
          done
          echo "✅ Pages servírují aktuální tabulku i rozpis."

          # Ostrý web na tjponikla.cz si fragmenty bere přesměrováním na Pages
          # (hosting z GitHubu zapsat nejde, viz hosting/htaccess-presmerovani.txt).
          for soubor in tabulka.html nadchazejici_zapasy.html; do
            url="${VEREJNE[$soubor]}"
            location=$(curl -sS -m 20 -D - -o /dev/null "$url" 2>/dev/null \
                       | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
            if [ -z "$location" ]; then
              echo "::warning::$url nepřesměrovává na Pages — na webu je pořád starý soubor. Nastav přesměrování: .venv/bin/python hosting/nahraj_htaccess.py"
              continue
            fi
            curl -sSL -m 20 -o "/tmp/w-$soubor" "$url?cb=$(date +%s)" || true
            if cmp -s "/tmp/w-$soubor" "$soubor"; then
              echo "✅ $url servíruje aktuální verzi (přes $location)"
            else
              echo "::error::$url přesměrovává, ale obsah nesouhlasí s repozitářem."
              exit 1
            fi
          done
