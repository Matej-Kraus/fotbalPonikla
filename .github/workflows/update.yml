name: Aktualizace tabulky a zápasů

on:
  schedule:
    # 6:00 UTC ~ 8:00 v Praze (posune se o hodinu při přechodu na zimní čas).
    # Pondělí, aby v tabulce už byly výsledky z víkendu.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Dva běhy najednou by si přepisovaly commity.
concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Nastavení gitu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Na hosting se odtud nenahrává — Websupport spojení z GitHubu zavírá.
      # Web si tabulky bere přesměrováním z GitHub Pages, takže stačí commit.
      - name: Spuštění update.py
        # Tři pokusy — sportmap.cz i denik.cz občas krátce nereagují.
        # Skript je idempotentní, opakování nic nerozbije.
        run: |
          for pokus in 1 2 3; do
            echo "::group::Pokus $pokus"
            if python update.py; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Pokus $pokus selhal."
            [ "$pokus" -lt 3 ] && sleep 60
          done
          echo "::error::Aktualizace selhala i po třech pokusech."
          exit 1

      # Zelený běh má znamenat "na webu je aktuální tabulka", ne jen
      # "commit prošel". Kontroluje se rovnou doména.
      - name: Kontrola, že web servíruje novou verzi
        run: |
          DOMENA="https://tjponikla.cz"
          server=$(curl -sS -m 20 -D - -o /dev/null "$DOMENA/" 2>/dev/null \
                   | tr -d '\r' | awk -F': ' 'tolower($1)=="server"{print $2}')
          echo "doménu obsluhuje: ${server:-neznámo}"
          if [ "$server" != "GitHub.com" ]; then
            echo "::warning::tjponikla.cz ještě neobsluhuje GitHub Pages (server: ${server:-neznámo}) — kontrolu přeskakuji. Až se přepne DNS, začne se kontrolovat ostrý web."
            exit 0
          fi
          for soubor in tabulka.html nadchazejici_zapasy.html; do
            echo "::group::$soubor"
            ok=0
            for pokus in $(seq 1 16); do
              curl -sSL -m 20 -o "/tmp/$soubor" "$DOMENA/$soubor?cb=$(date +%s)" || true
              if cmp -s "/tmp/$soubor" "$soubor"; then
                echo "shoda po $((pokus * 30))s"
                ok=1
                break
              fi
              sleep 30
            done
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              echo "::error::$soubor se na tjponikla.cz nepropsal ani po 8 minutách."
              exit 1
            fi
          done
          echo "✅ tjponikla.cz servíruje aktuální tabulku i rozpis."
